<!--
  Supabase "Confirm signup" email template.
  Paste into: Supabase Dashboard -> Authentication -> Emails -> Confirm signup
  Subject:    Your HarvestLink code: {{ .Token }}

  It carries BOTH the code (what the /verify-email screen asks for) and a
  button that signs the user in via /auth/confirm, so either works. The
  button needs Authentication -> URL Configuration -> Site URL to be the real
  site (https://bulkwinegrapes.com), because {{ .SiteURL }} is built from it.
-->
<div style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; max-width: 480px; margin: 0 auto; padding: 32px 24px; color: #1c1917;">
  <h1 style="font-size: 20px; margin: 0 0 8px;">Confirm your email</h1>
  <p style="font-size: 15px; line-height: 1.5; color: #57534e; margin: 0 0 24px;">
    Enter this code on the HarvestLink page you just came from:
  </p>
  <p style="font-size: 32px; font-weight: 700; letter-spacing: 8px; font-family: 'SFMono-Regular', Menlo, Consolas, monospace; background: #f5f5f4; border-radius: 12px; padding: 16px 0; text-align: center; margin: 0 0 24px;">
    {{ .Token }}
  </p>
  <p style="font-size: 15px; line-height: 1.5; color: #57534e; margin: 0 0 16px;">
    Or just click the button and we'll sign you in:
  </p>
  <p style="margin: 0 0 24px;">
    <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=signup&next=/dashboard"
       style="display: inline-block; background: #722545; color: #ffffff; text-decoration: none; font-weight: 600; font-size: 15px; padding: 12px 24px; border-radius: 999px;">
      Confirm my email
    </a>
  </p>
  <p style="font-size: 13px; line-height: 1.5; color: #78716c; margin: 0;">
    This code works once and expires soon. If you didn't create a HarvestLink account, you can ignore this email.
  </p>
</div>
